# Every number the sim uses that is NOT in the Forever client tables.
#
# Each value carries where it came from and how much to trust it:
#   confirmed  Blizzard's notes or measured in game
#   reported   third-party patch notes or community reports, not confirmed by Blizzard
#   classic    Classic Era value, assumed unchanged in Forever
#   guess      a placeholder until someone measures it
#
# `bun run sim` reports which guesses a result leans on. Replace a guess the moment
# better data exists, and update `source`.

# Character base values at level 60 =========================================

