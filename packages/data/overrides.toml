# Every number the sim uses that is NOT in the Forever client tables.
#
# Each value carries where it came from and how much to trust it:
#   confirmed  Blizzard's notes or measured in game
#   reported   third-party patch notes or community reports, not confirmed by Blizzard
#   classic    Classic Era value, assumed unchanged in Forever
#   guess      a placeholder until someone measures it
#
# `bun run sim` reports which guesses a result leans on. Replace a guess the moment
# better data exists, and update `source`.

# Base stats, base mana and agility per crit change with level: they are in levels.toml.

# Formulas ===================================================================

[formula.rangedAttackPowerPerAgility]
value = 2
confidence = "classic"
source = "Classic: hunter ranged AP = level * 2 + agility * 2 - 10"

[formula.rangedAttackPowerBase]
value = -10
confidence = "classic"
source = "Classic: hunter ranged AP = level * 2 + agility * 2 - 10"

[formula.rangedAttackPowerPerLevel]
value = 2
confidence = "classic"
source = "Classic: hunter ranged AP = level * 2 + agility * 2 - 10"

[formula.meleeAttackPowerPerStrength]
value = 1
confidence = "classic"
source = "Classic: hunter melee AP = level * 2 + strength + agility - 20"

[formula.meleeAttackPowerPerAgility]
value = 1
confidence = "classic"
source = "Classic: hunter melee AP = level * 2 + strength + agility - 20"

[formula.meleeAttackPowerPerLevel]
value = 2
confidence = "classic"
source = "Classic: hunter melee AP = level * 2 + strength + agility - 20"

[formula.meleeAttackPowerBase]
value = -20
confidence = "classic"
source = "Classic: hunter melee AP = level * 2 + strength + agility - 20"

# Melee specials with normalized weapon damage (Mongoose Bite, Strider Kick, Counterattack: effect
# 121) use a fixed speed per weapon type. Classic had no normalization; these are TBC's.
[formula.normalizedOneHandSpeed]
value = 2.4
confidence = "guess"
source = "TBC normalization: one-hand weapons 2.4 sec"

[formula.normalizedDaggerSpeed]
value = 1.7
confidence = "guess"
source = "TBC normalization: daggers 1.7 sec"

[formula.normalizedTwoHandSpeed]
value = 3.3
confidence = "guess"
source = "TBC normalization: two-hand weapons 3.3 sec"

[formula.dualWieldMissPct]
value = 19
confidence = "classic"
source = "Classic: white swings miss 19% more often while dual wielding (vmangos)"

[formula.runSpeedYdPerSec]
value = 7
confidence = "classic"
source = "Base run speed 7 yd/sec; speed auras (Strider Kick, Minor Speed boots) do not stack, the highest counts (wowsims/forever PR 575)"

# Forever lets traps be placed in combat. A trap lies where the hunter stands and springs on a target
# within 5 yards (so in melee, or mid-weave) once armed. The client has no trap object data.
[formula.trapArmingMs]
value = 500
confidence = "guess"
source = "wowsims/forever sim/hunter/traps.go: arming delay 0.5 sec, 'in-game testing required'"

[formula.offHandDamagePct]
value = 50
confidence = "classic"
source = "Classic: off-hand swings deal 50% damage; Predator's Edge raises that by up to 50% of itself"

[formula.attackPowerPerDps]
value = 14
confidence = "classic"
source = "Classic: 14 attack power adds 1 DPS to a weapon"

[formula.baseCritPct]
value = 0
confidence = "classic"
source = "Classic: hunters have no ranged crit beyond agility at 60"

[formula.critDamageBonusPct]
value = 100
confidence = "classic"
source = "Classic: ranged and melee crits deal 200% damage before talents"

[formula.armorConstantBase]
value = 400
confidence = "classic"
source = "Classic: reduction = armor / (armor + 400 + 85 * attacker level)"

[formula.armorConstantPerLevel]
value = 85
confidence = "classic"
source = "Classic: reduction = armor / (armor + 400 + 85 * attacker level)"

[formula.normalizedRangedSpeed]
value = 2.8
confidence = "guess"
source = "Forever shots use normalized weapon damage (effect 121), which Classic did not have. 2.8 sec is TBC's ranged normalization"

[formula.critRatingPerPct]
value = 14
confidence = "guess"
source = "Forever items carry crit as rating. Item allocations land on multiples of 14 where Classic items had +1% crit, so 14 rating = 1% at level 60"

[formula.hitRatingPerPct]
value = 10
confidence = "guess"
source = "Forever items carry hit as rating. Item allocations land on multiples of 10 where Classic items had +1% hit, so 10 rating = 1% at level 60"

[formula.autoShotStandStillMs]
value = 500
confidence = "confirmed"
source = "Blizzard 15 Oct beta notes, build 70425: stand still 0.5 sec before Auto Shot fires (via talentsforever.com)"

[formula.weaponProcPpm]
value = 1
confidence = "guess"
source = "Chance-on-hit weapons (Dark Iron Rifle, Blunderflame Bone Bow) and equip procs that say \"a chance\" over a client chance of 100 (Hurricane, Darkmoon Card: Maelstrom): the rate is server-side and not in the client. 1 proc per minute, as Classic weapon procs commonly ran"

[formula.rangedHasteAffectsCastTime]
value = 1
confidence = "guess"
source = "Whether Rapid Fire and quiver haste shorten Aimed Shot's cast. 1 = yes, 0 = no"

[formula.manaPerTickBase]
value = 15
confidence = "classic"
source = "Classic hunter regen per 2 sec tick outside the five second rule: 15 + spirit / 5. Unverified"

[formula.spiritPerManaPerTick]
value = 5
confidence = "classic"
source = "Classic hunter regen per 2 sec tick outside the five second rule: 15 + spirit / 5. Unverified"

[formula.manaPerIntellect]
value = 15
confidence = "classic"
source = "Classic: each point of intellect past the first 20 gives 15 mana"

# Targets ====================================================================
# Each preset is a level above the hunter. Armor is a warrior-class creature's at that level
# (levels.toml); the attack table follows from the level gap (see attackTable in the engine).

[targets.normal]
levelOffset = 0
confidence = "classic"
source = "A normal mob at the hunter's level"

[targets.elite]
levelOffset = 2
confidence = "guess"
source = "An elite two levels up, like a dungeon mob near the top of its range"

[targets.boss]
levelOffset = 3
confidence = "classic"
source = "Classic raid bosses are level 63 against level 60 players"

# Fights ====================================================================
# Fight-length presets (config fight.preset). Each fight's length is drawn within the variance of the
# typical length, so rotations that only pay off late (holding mana, long cooldowns) are tested on
# short and long fights alike. Pair them with a target preset: elite for dungeons, boss for raids.

[fights.dungeon-trash-30]
durationSec = 20
durationVariancePct = 40
confidence = "guess"
source = "Level 30 dungeon trash pulls: about half a boss kill. No timed trash pulls on record yet"

[fights.dungeon-boss-30]
durationSec = 38
durationVariancePct = 20
confidence = "reported"
source = "Level 30 beta dungeon bosses in a 5-man group died in 35, 40 and 39 sec (calibration/beta-level30.toml); most beta fights on Forever Logs ran under 60 sec"

[fights.dungeon-trash-60]
durationSec = 25
durationVariancePct = 40
confidence = "guess"
source = "Level 60 dungeon trash pulls: about half a boss kill. Forever launches 2026-11-04; recheck against Forever Logs"

[fights.dungeon-boss-60]
durationSec = 60
durationVariancePct = 30
confidence = "guess"
source = "Level 60 dungeon bosses in a geared 5-man group: about a minute, as in Classic Era. Recheck against Forever Logs after launch"

[fights.raid-boss]
durationSec = 180
durationVariancePct = 25
confidence = "guess"
source = "Raid bosses: the sim's 3 min default, within the 1 to 4 min most Classic Era raid kills take. Recheck against Forever Logs after launch"

# Crit lost against higher-level targets. Classic Era and both 1.12 server cores agree on 1% per level
# (0.2% per point of defense over the attacker's weapon skill).
[formula.critSuppressionPerLevelPct]
value = 1
confidence = "classic"
source = "vmangos Unit::GetUnitCriticalChance, cmangos-classic the same; Blizzard: crit modifiers are reduced against enemies 3 levels higher"

# Against targets 3 or more levels up, crit from auras (talents, buffs) is suppressed by a further
# amount, on top of the per-level loss. Not in either server core; measured in Classic.
[formula.auraCritSuppressionPct]
value = 1.8
confidence = "reported"
source = "Classic beta testing, 60k+ hits: ~1.8% more on aura crit, ~4.8% total against level 63 (us.forums.blizzard.com/en/wow/t/crit-auras-and-raid-bosses/222790). Blizzard called it 1.12 behaviour; one fit gave 1.58%"

# Pets =======================================================================

# How much of the hunter's ranged AP the pet gains. Classic pets did not scale with hunter gear at all;
# scaling arrived in TBC. Forever behaviour unknown.
[pet.inheritRangedAttackPowerPct]
value = 10
confidence = "guess"
source = "wow-forever-rotation.vercel.app assumption"

# Pet white damage per 2.0 sec swing at the pet's base attack power, per pet level. Attack power
# above base scales it by 0.7 + 0.3 * AP / baseAP. Pets keep their native speed with damage scaled
# to it, so the sim normalizes everything to 2.0 sec.
[pet.baseDamagePerLevel]
min = 1.2075
max = 1.5225
confidence = "classic"
source = "vmangos Pet::InitStatsForLevel (L * 1.15 * 1.05 to L * 1.45 * 1.05), 'from vanilla pet tab screenshots'; 72-91 at 60. cmangos uses 0.75-1.125 * L + AP/14 instead"

[pet.focusPerSecond]
value = 10
confidence = "guess"
source = "wow-forever-rotation.vercel.app uses 10 per sec. Classic's rate is not pinned down; measure in game"

[pet.happinessDamagePct]
value = 25
confidence = "classic"
source = "Classic: a happy pet deals 125% damage"

# The pet's miss, dodge and glancing follow from the level gap like the hunter's (attackTable in
# the engine). Whether pets glance is not confirmed.

[pet.baseCritPct]
value = 5
confidence = "guess"
source = "Pet base melee crit, unknown"

[pet.attackSpeedSec]
value = 2.0
confidence = "classic"
source = "Classic normalizes pet DPS to a 2.0 sec swing whatever the native speed"

