# Found by `sim build configs/level30/sv.toml` (2026-10-26): +50.69% DPS on 5000 fresh fights.
extends = "sv.toml"
name = "Level 30 sv, GearQuest good gear, build search"
position = "weave"

[weave]
maxAutoShotDelayMs = 900

[talents]
"Improved Tracking" = 5
"Deflection" = 3
"Savage Strikes" = 2
"Resourcefulness" = 1
"Predator's Edge" = 5
"Surefooted" = 3
"Clever Traps" = 2

[pet]
active = true
family = "Wind Serpent"

[rotation]
precombat = ["aspect_of_the_hawk", "hunters_mark", "trueshot_aura"]

[[rotation.actions]]
action = "multi_shot"

[[rotation.actions]]
action = "rapid_fire"

[[rotation.actions]]
action = "arcane_shot"

[[rotation.actions]]
action = "bestial_wrath"

[[rotation.actions]]
action = "sniper_shot"

[[rotation.actions]]
action = "summon_hawk"

[[rotation.actions]]
action = "mongoose_bite"

[[rotation.actions]]
action = "raptor_strike"

[[rotation.actions]]
action = "immolation_trap"

[[rotation.actions]]
action = "explosive_trap"

[[rotation.actions]]
action = "serpent_sting"
if = "!debuff.serpent_sting.up & fight.remains > 9"
