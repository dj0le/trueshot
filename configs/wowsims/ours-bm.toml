# Our bm.build.toml talents, pet, style and rotation on his gear and buffs.
extends = "base.toml"
name = "our bm.build on his gear"
position = "ranged"

[weave]
maxAutoShotDelayMs = 1200

[talents]
"Deadly Aspects" = 5
"Focused Fire" = 2
"Lethal Attacks" = 5
"Improved Stings" = 3
"Efficiency" = 3
"Careful Aim" = 5
"Rapid Killing" = 0
"Improved Arcane Shot" = 0
"Trueshot Aura" = 1
"Mortal Shots" = 0
"Rapid Recuperation" = 0
"Barrage" = 0
"Ranged Weapon Specialization" = 0
"Sniper Shot" = 0
"Improved Tracking" = 3
"Endurance Training" = 1
"Improved Aspect of the Monkey" = 2
"Bestial Swiftness" = 1
"Unleashed Fury" = 5
"Ferocity" = 5
"Summon Hawk" = 1
"Bestial Discipline" = 2
"Intimidation" = 1
"Frenzy" = 5
"Bestial Wrath" = 1

[pet]
active = true
family = "Wind Serpent"

[rotation]
precombat = ["aspect_of_the_hawk", "hunters_mark", "trueshot_aura"]

[[rotation.actions]]
action = "slayers_crest"
if = "time > 5"

[[rotation.actions]]
action = "kiss_of_the_spider"
if = "time > 5"

[[rotation.actions]]
action = "major_mana_potion"
if = "mana.deficit > 2250"

[[rotation.actions]]
action = "demonic_rune"
if = "mana.deficit > 1500"

[[rotation.actions]]
action = "mongoose_bite"

[[rotation.actions]]
action = "explosive_trap"

[[rotation.actions]]
action = "rapid_fire"

[[rotation.actions]]
action = "blood_fury"

[[rotation.actions]]
action = "berserking"

[[rotation.actions]]
action = "elunes_light"

[[rotation.actions]]
action = "aimed_shot"
if = "mana.pct > 25"

[[rotation.actions]]
action = "multi_shot"
if = "mana.pct > 40"

[[rotation.actions]]
action = "hunters_mark"
if = "!debuff.hunters_mark.up"

[[rotation.actions]]
action = "sniper_shot"

[[rotation.actions]]
action = "bestial_wrath"

[[rotation.actions]]
action = "raptor_strike"

[[rotation.actions]]
action = "immolation_trap"

[[rotation.actions]]
action = "serpent_sting"
if = "!debuff.serpent_sting.up"
