# His talents, pet and APL on our pre-raid gear (Orc), with his raid buffs.
extends = "../mm.build.toml"
name = "his 7/39/5 on our gear, Sniper Shot in Rapid Fire or Quick Shots"
support = "jow"

# His raid buffs and consumables, as in base.toml.
[buffs]
agility = 114
strength = 89
stamina = 12
intellect = 43
spirit = 52
critPct = 5
attackPower = 417
mp5 = 20

# His boss with his armor debuffs, as in base.toml.
[target]
level = 63
armor = 3731
armorReduction = 3395
creatureType = "humanoid"

[fight]
durationSec = 180
durationVariancePct = 3
iterations = 2000

[talents]
"Hawk Eye" = 0
"Lethal Attacks" = 5
"Improved Stings" = 3
"Efficiency" = 2
"Careful Aim" = 5
"Rapid Killing" = 2
"Improved Arcane Shot" = 5
"Lone Wolf" = 0
"Trueshot Aura" = 1
"Mortal Shots" = 5
"Rapid Recuperation" = 2
"Barrage" = 3
"Ranged Weapon Specialization" = 5
"Sniper Shot" = 1
"Deadly Aspects" = 5
"Focused Fire" = 2
"Improved Tracking" = 5

[pet]
active = true
family = "Cat"

[rotation]
precombat = ["aspect_of_the_hawk","trueshot_aura","hunters_mark"]

[[rotation.actions]]
action = "rapid_fire"
if = "time > 5"

[[rotation.actions]]
action = "major_mana_potion"
if = "mana.deficit > 2250"

[[rotation.actions]]
action = "demonic_rune"
if = "mana.deficit > 1500"

[[rotation.actions]]
action = "hunters_mark"
if = "!debuff.hunters_mark.up"

[[rotation.actions]]
action = "sniper_shot"
if = "buff.rapid_fire.up | buff.quick_shots.up"

[[rotation.actions]]
action = "aimed_shot"

[[rotation.actions]]
action = "serpent_sting"
if = "!dot.serpent_sting.ticking"

[[rotation.actions]]
action = "arcane_shot"
