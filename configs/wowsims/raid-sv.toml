# Our solo sv.build.toml (pre-raid gear, Orc) with his raid buffs, debuffs, Judgement of Wisdom and mana consumables.
extends = "../sv.build.toml"
name = "our sv.build, his raid buffs"
support = "jow"

# His raid buffs and consumables, as in base.toml.
[buffs]
agility = 114
strength = 89
stamina = 12
intellect = 43
spirit = 52
critPct = 5
attackPower = 417
mp5 = 20

# His boss with his armor debuffs, as in base.toml.
[target]
level = 63
armor = 3731
armorReduction = 3395
creatureType = "humanoid"

[fight]
durationSec = 180
durationVariancePct = 3
iterations = 2000

[rotation]
precombat = ["aspect_of_the_beast", "hunters_mark", "trueshot_aura"]

[[rotation.actions]]
action = "major_mana_potion"
if = "mana.deficit > 2250"

[[rotation.actions]]
action = "demonic_rune"
if = "mana.deficit > 1500"

[[rotation.actions]]
action = "immolation_trap"
if = "fight.remains > 5"

[[rotation.actions]]
action = "blood_fury"

[[rotation.actions]]
action = "mongoose_bite"

[[rotation.actions]]
action = "raptor_strike"

[[rotation.actions]]
action = "strider_kick"

[[rotation.actions]]
action = "bestial_wrath"

[[rotation.actions]]
action = "rapid_fire"

[[rotation.actions]]
action = "sniper_shot"

[[rotation.actions]]
action = "summon_hawk"

[[rotation.actions]]
action = "hunters_mark"
if = "!debuff.hunters_mark.up"

[[rotation.actions]]
action = "explosive_trap"

[[rotation.actions]]
action = "lacerate"
if = "fight.remains > 6"

[[rotation.actions]]
action = "wing_clip"
