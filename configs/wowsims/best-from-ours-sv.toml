# Found by `sim build configs/wowsims/ours-sv.toml` (2026-10-26): +30.36% DPS on 5000 fresh fights.
extends = "ours-sv.toml"
name = "our sv.build on his gear, build search"
position = "weave"

[weave]
maxAutoShotDelayMs = 2000

[talents]
"Deadly Aspects" = 5
"Focused Fire" = 2
"Lethal Attacks" = 5
"Improved Stings" = 0
"Efficiency" = 1
"Careful Aim" = 5
"Rapid Killing" = 0
"Improved Arcane Shot" = 0
"Trueshot Aura" = 0
"Mortal Shots" = 0
"Rapid Recuperation" = 0
"Barrage" = 0
"Ranged Weapon Specialization" = 0
"Sniper Shot" = 0
"Improved Tracking" = 5
"Savage Strikes" = 2
"Survivalist" = 3
"Surefooted" = 3
"Clever Traps" = 2
"Predator's Edge" = 5
"Expose Prey" = 2
"Resourcefulness" = 0
"Strider Kick" = 1
"Lightning Reflexes" = 5
"Lacerating Strikes" = 1
"Survival Tactics" = 2
"Survivalist's Discipline" = 2
"Entrapment" = 0

[pet]
active = true
family = "Raptor"

[rotation]
precombat = ["aspect_of_the_beast", "hunters_mark", "trueshot_aura"]

[[rotation.actions]]
action = "slayers_crest"

[[rotation.actions]]
action = "kiss_of_the_spider"

[[rotation.actions]]
action = "demonic_rune"

[[rotation.actions]]
action = "blood_fury"
if = "mana.pct > 70"

[[rotation.actions]]
action = "mongoose_bite"

[[rotation.actions]]
action = "raptor_strike"

[[rotation.actions]]
action = "strider_kick"

[[rotation.actions]]
action = "bestial_wrath"

[[rotation.actions]]
action = "arcane_shot"

[[rotation.actions]]
action = "summon_hawk"

[[rotation.actions]]
action = "major_mana_potion"

[[rotation.actions]]
action = "explosive_trap"

[[rotation.actions]]
action = "lacerate"
if = "fight.remains > 9 & !debuff.lacerate.up"

[[rotation.actions]]
action = "aimed_shot"

[[rotation.actions]]
action = "sniper_shot"

[[rotation.actions]]
action = "hunters_mark"
if = "!debuff.hunters_mark.up"

[[rotation.actions]]
action = "rapid_fire"
