# Our mm.build.toml talents, pet, style and rotation on his gear and buffs.
extends = "base.toml"
name = "our mm.build on his gear"
position = "ranged"

[weave]
maxAutoShotDelayMs = 1200

[talents]
"Deadly Aspects" = 5
"Focused Fire" = 2
"Lethal Attacks" = 5
"Improved Stings" = 3
"Efficiency" = 5
"Careful Aim" = 5
"Rapid Killing" = 2
"Improved Arcane Shot" = 3
"Trueshot Aura" = 1
"Mortal Shots" = 5
"Rapid Recuperation" = 2
"Barrage" = 3
"Ranged Weapon Specialization" = 5
"Sniper Shot" = 0
"Improved Tracking" = 5

[pet]
active = true
family = "Wind Serpent"

[rotation]
precombat = ["aspect_of_the_hawk", "trueshot_aura", "hunters_mark"]

[[rotation.actions]]
action = "slayers_crest"
if = "time > 5"

[[rotation.actions]]
action = "kiss_of_the_spider"
if = "time > 5"

[[rotation.actions]]
action = "major_mana_potion"
if = "mana.deficit > 2250"

[[rotation.actions]]
action = "demonic_rune"
if = "mana.deficit > 1500"

[[rotation.actions]]
action = "rapid_fire"

[[rotation.actions]]
action = "elunes_light"

[[rotation.actions]]
action = "hunters_mark"
if = "!debuff.hunters_mark.up"

[[rotation.actions]]
action = "blood_fury"

[[rotation.actions]]
action = "berserking"

[[rotation.actions]]
action = "aimed_shot"
if = "mana.pct > 15"

[[rotation.actions]]
action = "sniper_shot"
if = "mana.pct > 90"

[[rotation.actions]]
action = "serpent_sting"
if = "!debuff.serpent_sting.up"

[[rotation.actions]]
action = "bestial_wrath"

[[rotation.actions]]
action = "summon_hawk"

[[rotation.actions]]
action = "mongoose_bite"

[[rotation.actions]]
action = "raptor_strike"

[[rotation.actions]]
action = "immolation_trap"

[[rotation.actions]]
action = "explosive_trap"
