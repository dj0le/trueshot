# Best 1 minute build for SV melee: talents and rotation from 3 independent `sim build --keep-style --budget 600` searches (2026-11-03, after the patch and the channel swing fix), solo against a level 63 boss.
extends = "../sv-melee.toml"
name = "SV melee, 60 sec, best build"
position = "melee"

[weave]
maxAutoShotDelayMs = 1200

[talents]
"Deadly Aspects" = 5
"Lethal Attacks" = 5
"Efficiency" = 2
"Careful Aim" = 5
"Improved Tracking" = 5
"Savage Strikes" = 2
"Survivalist" = 3
"Surefooted" = 3
"Clever Traps" = 2
"Predator's Edge" = 3
"Expose Prey" = 2
"Resourcefulness" = 2
"Strider Kick" = 1
"Lightning Reflexes" = 4
"Lacerating Strikes" = 1
"Survival Tactics" = 2
"Focused Fire" = 2
"Survivalist's Discipline" = 2

[pet]
active = true
family = "Raptor"

[rotation]
precombat = ["aspect_of_the_beast", "hunters_mark", "trueshot_aura"]

[[rotation.actions]]
action = "immolation_trap"
if = "fight.remains > 4"

[[rotation.actions]]
action = "lacerate"
if = "!debuff.lacerate.up"

[[rotation.actions]]
action = "mongoose_bite"

[[rotation.actions]]
action = "raptor_strike"

[[rotation.actions]]
action = "strider_kick"

[[rotation.actions]]
action = "hunters_mark"
if = "!debuff.hunters_mark.up"

[[rotation.actions]]
action = "bestial_wrath"

[[rotation.actions]]
action = "sniper_shot"

[[rotation.actions]]
action = "summon_hawk"

[[rotation.actions]]
action = "blood_fury"

[[rotation.actions]]
action = "explosive_trap"

[[rotation.actions]]
action = "rapid_fire"

[[rotation.actions]]
action = "volley"
if = "mana.pct > 20"

[[rotation.actions]]
action = "wing_clip"

[fight]
durationSec = 60
durationVariancePct = 20
