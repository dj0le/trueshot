# Best 2 minute build for BM ranged: talents and rotation from 3 independent `sim build --keep-style --budget 600 --spec bm` searches (2026-11-11, after pet glancing and trap crits, tasks 62, 66, 67), solo against a level 63 boss. Two found this at the same DPS (+5.97% on the 2026-11-03 build, paired on 20000 fights); the third stayed on the old build. Bestial Wrath and Frenzy 3 to 5 gave way to Improved Tracking 5, and Multi-Shot left the rotation.
extends = "../bm-cat.optimized.toml"
name = "BM ranged, 120 sec, best build"
position = "ranged"

[weave]
maxAutoShotDelayMs = 1200

[talents]
"Deadly Aspects" = 5
"Endurance Training" = 1
"Focused Fire" = 2
"Improved Aspect of the Monkey" = 2
"Bestial Swiftness" = 1
"Unleashed Fury" = 5
"Ferocity" = 5
"Summon Hawk" = 1
"Bestial Discipline" = 2
"Intimidation" = 1
"Frenzy" = 2
"Bestial Wrath" = 0
"Lethal Attacks" = 5
"Efficiency" = 5
"Careful Aim" = 5
"Improved Arcane Shot" = 0
"Trueshot Aura" = 1
"Improved Stings" = 3
"Improved Tracking" = 5

[pet]
active = true
family = "Wind Serpent"

[rotation]
precombat = ["aspect_of_the_hawk", "hunters_mark", "trueshot_aura"]

[[rotation.actions]]
action = "blood_fury"

[[rotation.actions]]
action = "arcane_shot"

[[rotation.actions]]
action = "serpent_sting"
if = "!debuff.serpent_sting.up & fight.remains > 6"

[[rotation.actions]]
action = "berserking"

[[rotation.actions]]
action = "rapid_fire"

[[rotation.actions]]
action = "summon_hawk"

[[rotation.actions]]
action = "bestial_wrath"

[[rotation.actions]]
action = "sniper_shot"

[[rotation.actions]]
action = "mongoose_bite"

[[rotation.actions]]
action = "raptor_strike"

[[rotation.actions]]
action = "immolation_trap"

[[rotation.actions]]
action = "elunes_light"

[[rotation.actions]]
action = "explosive_trap"
[fight]
durationSec = 120
durationVariancePct = 20
