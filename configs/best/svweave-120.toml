# Best 2 minute build for SV weave (perfect execution): talents and rotation from 3 independent `sim build --keep-style --budget 600` searches (2026-11-03, after the patch and the channel swing fix), solo against a level 63 boss.
extends = "../sv-melee.toml"
name = "SV weave (perfect execution), 120 sec, best build"
position = "weave"

[weave]
maxAutoShotDelayMs = 1200

[talents]
"Deadly Aspects" = 0
"Lethal Attacks" = 5
"Efficiency" = 5
"Careful Aim" = 5
"Improved Tracking" = 5
"Savage Strikes" = 2
"Survivalist" = 3
"Surefooted" = 3
"Clever Traps" = 2
"Predator's Edge" = 3
"Expose Prey" = 2
"Resourcefulness" = 2
"Strider Kick" = 1
"Lightning Reflexes" = 5
"Lacerating Strikes" = 1
"Trueshot Aura" = 1
"Survival Tactics" = 2
"Survivalist's Discipline" = 2
"Mortal Shots" = 2

[pet]
active = true
family = "Wind Serpent"

[rotation]
precombat = ["aspect_of_the_beast", "hunters_mark", "trueshot_aura"]

[[rotation.actions]]
action = "rapid_fire"

[[rotation.actions]]
action = "raptor_strike"

[[rotation.actions]]
action = "bestial_wrath"

[[rotation.actions]]
action = "sniper_shot"

[[rotation.actions]]
action = "summon_hawk"

[[rotation.actions]]
action = "immolation_trap"
if = "fight.remains > 6"

[[rotation.actions]]
action = "explosive_trap"

[[rotation.actions]]
action = "blood_fury"

[[rotation.actions]]
action = "mongoose_bite"

[[rotation.actions]]
action = "strider_kick"

[[rotation.actions]]
action = "lacerate"
if = "!debuff.lacerate.up"

[[rotation.actions]]
action = "arcane_shot"

[fight]
durationSec = 120
durationVariancePct = 20
